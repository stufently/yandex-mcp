[[faq]]
q = "How do I install Yandex MCP?"
a = "No clone or build is needed. With Node.js 22 or newer, run a server with npx, for example YANDEX_WEBMASTER_TOKEN=your-oauth-token npx -y @stufently/yandex-webmaster-mcp, and register the same command in your MCP client."

[[faq]]
q = "Which Yandex APIs are covered?"
a = "Five servers: Yandex Search API v2, Wordstat (Cloud Search API v2), Webmaster API v4, Metrika API and Direct API v5 — 94 tools in total."

[[faq]]
q = "Which AI clients does it work with?"
a = "Any MCP client over stdio. The README has ready configs for Claude Code, Claude Desktop, Cursor, Windsurf, Zed and Codex; Claude Code is verified in daily use."

[[faq]]
q = "Why must I use the @stufently/ package names?"
a = "The unscoped names such as yandex-webmaster-mcp on npm belong to a different publisher. Running them with your Yandex tokens in the environment hands those tokens to unrelated code, so always type the @stufently/ prefix."

[[faq]]
q = "Can the Direct server change my live ad account?"
a = "Yes. Every Direct write hits the production account. The fourteen irreversible tools refuse unless the call passes confirm: true, and YANDEX_DIRECT_SANDBOX=true points the server at the Direct sandbox for experiments."

[[faq]]
q = "Which tokens do I need?"
a = "Only the ones for the servers you enable: an API key and folder ID from Yandex Cloud for Search and Wordstat, and OAuth tokens for Webmaster, Metrika and Direct. Each server starts without them and names the missing variable on the first tool call."
