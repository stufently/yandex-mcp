name: Publish to npm

# Auth is npm trusted publishing (GitHub OIDC): no NPM_TOKEN secret. Each
# @stufently/yandex-*-mcp package on npmjs.com must list this repo and the
# workflow file `publish.yml` as its trusted publisher, with `npm publish`
# allowed. npm attaches provenance automatically on this path.
# workflow_dispatch publishes the versions in package.json from the chosen ref,
# e.g. after the trusted publisher is first configured.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    # Пакеты публикуются под скоупом @stufently/*: неймспейсы без скоупа
    # (yandex-search-mcp и т.д.) на npm принадлежат другому издателю (altrr2,
    # первая публикация 2025-12-20), и публикация в них вернула бы 403.
    strategy:
      matrix:
        package:
          - yandex-search-mcp
          - yandex-wordstat-mcp
          - yandex-webmaster-mcp
          - yandex-metrika-mcp
          - yandex-direct-mcp

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0
      # (docs.npmjs.com/trusted-publishers). Node 24 ships npm 11.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check npm version
        run: |
          v=$(npm --version)
          echo "npm $v"
          if [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -n1)" != 11.5.1 ]; then
            echo "::error::npm $v is older than 11.5.1, trusted publishing will not work"; exit 1
          fi

      # The packages ship plain .mjs sources (no build step), so the publish
      # job installs nothing. A version already on npm (e.g. a first manual
      # upload) is skipped, so the registry job can still run after it.
      - name: Publish ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: |
          set -euo pipefail
          name=$(jq -r .name package.json)
          version=$(jq -r .version package.json)
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://registry.npmjs.org/${name/\//%2f}/$version")
          if [ "$code" = "200" ]; then
            echo "$name@$version is already on npm, skipping"; exit 0
          fi
          npm publish --provenance --access public

  # Runs once all five packages are on npm: the registry checks each package's
  # mcpName against npm before it accepts the entry.
  registry:
    name: MCP Registry
    needs: publish
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/registry.yml
