name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    # Пакеты публикуются под скоупом @stufently/*: неймспейсы без скоупа
    # (yandex-search-mcp и т.д.) на npm принадлежат другому издателю (altrr2,
    # первая публикация 2025-12-20), и публикация в них вернула бы 403.
    strategy:
      matrix:
        package:
          - yandex-search-mcp
          - yandex-wordstat-mcp
          - yandex-webmaster-mcp
          - yandex-metrika-mcp
          - yandex-direct-mcp

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Third-party экшен запинен по commit-SHA: эта джоба держит NPM_TOKEN и
      # публикует пакеты, а тег v2 у апстрима mutable. SHA = то, во что v2
      # резолвился на 2026-07-25 (релиз v2.2.0), т.е. поведение не меняется.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
