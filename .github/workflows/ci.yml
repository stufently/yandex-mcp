name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Third-party экшен запинен по commit-SHA (тег v2 у апстрима mutable).
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      # Third-party экшен запинен по commit-SHA (тег v2 у апстрима mutable).
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: node --test

      # Сервер по природе не завершается, поэтому «просто импортировать» его нельзя:
      # прежний шаг уводил импорт в фон через `&` и был зелёным даже при падении.
      # Здесь поднимаем каждый сервер по-настоящему и спрашиваем tools/list.
      - name: Smoke test MCP servers
        run: node scripts/smoke-tools.mjs
